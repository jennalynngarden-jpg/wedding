  <main>
    <section class="content-section">
      <h2 class="section-heading">Photos</h2>
      <div class="section-divider"></div>

      <!-- Engagement Photos -->
      <div class="photos-section">
        <h3 class="photos-section-title">Engagement</h3>
        <div class="photo-carousel" id="engagement-carousel">
          <button class="photo-carousel-arrow photo-carousel-arrow--left" aria-label="Previous">&lsaquo;</button>
          <div class="photo-carousel-track-container">
            <div class="photo-carousel-track">
              <div class="photo-carousel-slide"><img src="images/6.JPG" alt="Jenna and Liam embracing on the beach" loading="lazy"></div>
              <div class="photo-carousel-slide"><img src="images/1.JPG" alt="Jenna and Liam close-up portrait" loading="lazy"></div>
              <div class="photo-carousel-slide"><img src="images/12.JPG" alt="Jenna and Liam walking hand in hand" loading="lazy"></div>
              <div class="photo-carousel-slide"><img src="images/8.JPG" alt="Jenna and Liam full-length embrace on beach" loading="lazy"></div>
              <div class="photo-carousel-slide"><img src="images/5.JPG" alt="Jenna reacting to the proposal" loading="lazy"></div>
              <div class="photo-carousel-slide"><img src="images/11.JPG" alt="Hands clasped showing engagement ring" loading="lazy"></div>
              <div class="photo-carousel-slide"><img src="images/10.JPG" alt="Jenna and Liam walking with their dog" loading="lazy"></div>
            </div>
          </div>
          <button class="photo-carousel-arrow photo-carousel-arrow--right" aria-label="Next">&rsaquo;</button>
          <div class="photo-carousel-dots"></div>
        </div>
      </div>

      <!-- Guest Memories -->
      <div class="photos-section" id="memories-section">
        <h3 class="photos-section-title">Memories</h3>
        <p class="photos-section-intro">Photos shared by our guests</p>
        <div class="photo-carousel" id="memories-carousel">
          <button class="photo-carousel-arrow photo-carousel-arrow--left" aria-label="Previous">&lsaquo;</button>
          <div class="photo-carousel-track-container">
            <div class="photo-carousel-track" id="memories-track">
              <!-- Guest photos will be loaded here dynamically -->
            </div>
          </div>
          <button class="photo-carousel-arrow photo-carousel-arrow--right" aria-label="Next">&rsaquo;</button>
          <div class="photo-carousel-dots" id="memories-dots"></div>
        </div>
        <p class="photos-empty-message" id="memories-empty">No photos yet. Be the first to share a memory when you RSVP!</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
